[project]
name = "riffle"
version = "0.4.0.dev0"
description = "Collection, decks, paper and MTGO prices, rendered into an Obsidian vault"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "rich>=13.7",
    "backports-zstd>=1.7.0 ; python_full_version < '3.14'",
]


[project.scripts]
riffle = "riffle.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riffle"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["postgres: needs a running Postgres; skipped when none is reachable"]
# Every run measures coverage and lists the files with untested lines or branches.
# CI adds --cov-fail-under; locally a single test file can still run on its own.
addopts = "--cov --cov-report=term-missing:skip-covered"

[tool.coverage.run]
source = ["riffle"]
branch = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]
